name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            image-extension: gd
          - php: '8.3'
            laravel: '^13.0'
            image-extension: imagick
          - php: '8.4'
            laravel: '^12.0'
            image-extension: imagick
          - php: '8.4'
            laravel: '^13.0'
            image-extension: gd
          - php: '8.5'
            laravel: '^12.0'
            image-extension: gd
          - php: '8.5'
            laravel: '^13.0'
            image-extension: imagick

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ${{ matrix.image-extension }}
          tools: composer:v2

      - run: composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/filesystem:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest
      - run: vendor/bin/pint --test
      - run: composer analyse
